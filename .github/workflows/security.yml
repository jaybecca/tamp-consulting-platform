name: TAMP Consulting Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-check:
    name: Security and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check project files
        run: |
          echo "Checking for suspicious secret patterns..."

          if grep -RniE \
            'password[[:space:]]*[:=]|secret[[:space:]]*[:=]|access[_-]?key[[:space:]]*[:=]|api[_-]?key[[:space:]]*[:=]|private[_-]?key[[:space:]]*[:=]' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.png' \
            --exclude='*.gif' \
            --exclude='*.svg'; then

            echo "Potential secret detected."
            exit 1
          else
            echo "No obvious hard-coded secrets detected."
          fi

      - name: Validate HTML files
        run: |
          echo "HTML files found:"
          find . -maxdepth 2 -name "*.html" -print

      - name: Validate JavaScript files
        run: |
          echo "JavaScript files found:"
          find . -maxdepth 2 -name "*.js" -print

      - name: Validate CSS files
        run: |
          echo "CSS files found:"
          find . -maxdepth 2 -name "*.css" -print

      - name: Repository status
        run: |
          git status --short
          echo "Security CI checks completed."
